name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy-and-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pure policy and adversarial tests
        run: npm test
      - name: Source safety contracts
        run: npm run check:site
      - name: CLI fixture output
        run: |
          node bin/audit.mjs examples/cases.json > /tmp/agent-policy-results.json
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('/tmp/agent-policy-results.json'));if(r.reviewed!==6||r.results.some(x=>x.realExecutionAllowed||x.realIdentityVerified||x.financialAuthority))process.exit(1);"
  real-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage exact static public files
        run: npm run stage
      - name: Validate actual Chrome
        run: |
          google-chrome --version
          npm run browser:smoke
